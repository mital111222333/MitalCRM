<style>
  .me-top { background: #0e2433; color: #e3efef; padding: 12px 16px; display: flex; align-items: center; gap: 12px; position: sticky; top: 0; z-index: 5; }
  .me-top b { font: 600 18px/1 'Unbounded', sans-serif; }
  .me-top .spacer { flex: 1; }
  .me-top button { background: #ffffff14; border: 1px solid #ffffff30; color: #e3efef; border-radius: 99px; padding: 6px 12px; font: inherit; cursor: pointer; }
  .me-wrap { max-width: 1100px; margin: 0 auto; padding: 16px; }
  .me-wrap nav.tabs { overflow-x: auto; white-space: nowrap; }
  .me-wrap .panel { margin-bottom: 14px; }
  .chat-list { display: flex; flex-direction: column; gap: 8px; max-height: 60vh; overflow-y: auto; padding: 4px 2px; }
  .chat-msg { max-width: 82%; padding: 8px 12px; border-radius: 14px; background: var(--card, #fff); border: 1px solid var(--line, #dde3e8); white-space: pre-wrap; word-wrap: break-word; }
  .chat-msg.me { align-self: flex-end; background: #dff3ea; border-color: #bfe3d2; }
  html[data-theme="dark"] .chat-msg.me { background: #1d3b30; border-color: #2c5646; }
  .chat-msg small { display: block; opacity: .6; font-size: 11px; margin-top: 2px; }
  .chat-msg img { max-width: 100%; border-radius: 10px; display: block; margin-bottom: 4px; }
  .chat-send { display: flex; gap: 8px; align-items: flex-end; margin-top: 10px; }
  .chat-send textarea { flex: 1; min-width: 0; resize: none; }
</style>
</head>

<header class="me-top"><b>mital</b><span>Мой кабинет</span><span class="spacer"></span><button id="meUpd" type="button">🔄 Обновить</button></header>

</main>
