<style>/* boot screen: shown when the CRM is opened from its home-screen icon; same dark colour as the system splash, so the two blend */
#boot{display:none}
html.boot,html.boot body{background:#050509}
html.boot #boot{display:flex;position:fixed;inset:0;z-index:2147483000;background:#050509;align-items:center;justify-content:center;overflow:hidden;transition:opacity .3s ease,transform .3s ease;font-family:Inter,system-ui,-apple-system,sans-serif}
#boot.out{opacity:0;transform:scale(1.06);pointer-events:none}
#boot .bglow{position:absolute;width:420px;height:420px;border-radius:50%;background:radial-gradient(circle,rgba(58,155,255,.16),rgba(94,75,220,.08) 45%,transparent 70%);animation:bgl 2.6s ease-in-out infinite}
#boot .bscene{position:relative;width:150px;height:200px;perspective:800px;transform-style:preserve-3d}
#boot .btilt{position:absolute;inset:0;transform-style:preserve-3d;transform:rotateX(-8deg)}
#boot .bdrop{position:absolute;inset:27px 24px;transform-style:preserve-3d;animation:bspin 2.6s cubic-bezier(.55,.05,.35,1) infinite}
#boot .bdrop svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
#boot .bring{opacity:0;position:absolute;left:50%;top:50%;width:230px;height:230px;margin:-115px 0 0 -115px;border-radius:50%;border:1.5px solid rgba(58,155,255,.45);transform-style:preserve-3d;box-shadow:0 0 18px rgba(58,155,255,.25)}
#boot .bring::after{content:"";position:absolute;top:-5px;left:50%;width:9px;height:9px;margin-left:-4.5px;border-radius:50%;background:#7cc0ff;box-shadow:0 0 12px 3px rgba(58,155,255,.9)}
#boot .br1{animation:br1 3.2s linear infinite,bfade .35s .05s ease forwards}
#boot .br2{width:260px;height:260px;margin:-130px 0 0 -130px;border-color:rgba(255,184,0,.35);box-shadow:0 0 18px rgba(255,184,0,.18);animation:br2 4.4s linear infinite,bfade .35s .1s ease forwards}
#boot .br2::after{background:#ffd76a;box-shadow:0 0 12px 3px rgba(255,184,0,.85)}
#boot .bshadow{position:absolute;left:50%;bottom:-34px;width:110px;height:18px;margin-left:-55px;border-radius:50%;background:radial-gradient(rgba(255,184,0,.35),transparent 70%);filter:blur(2px);animation:bsh 2.6s ease-in-out infinite}
#boot .bname{position:absolute;left:0;right:0;top:calc(50% + 150px);text-align:center;color:#fff;font-weight:800;font-size:20px;letter-spacing:.32em;padding-left:.32em;opacity:0;animation:bname .5s .1s ease forwards}
#boot .bname small{display:block;margin-top:6px;font-size:11px;font-weight:600;letter-spacing:.28em;color:rgba(255,255,255,.45)}
#boot .bbar{position:absolute;left:50%;top:calc(50% + 214px);width:120px;height:3px;margin-left:-60px;border-radius:3px;background:rgba(255,255,255,.08);overflow:hidden}
#boot .bbar i{position:absolute;top:0;bottom:0;width:40%;border-radius:3px;background:linear-gradient(90deg,transparent,#3a9bff,#ffb800,transparent);animation:bbar 1.3s ease-in-out infinite}
@keyframes bspin{0%{transform:rotateY(0) translateY(0)}50%{transform:rotateY(180deg) translateY(-10px)}100%{transform:rotateY(360deg) translateY(0)}}
@keyframes br1{from{transform:rotateX(74deg) rotateY(-12deg) rotateZ(0)}to{transform:rotateX(74deg) rotateY(-12deg) rotateZ(360deg)}}
@keyframes br2{from{transform:rotateX(68deg) rotateY(22deg) rotateZ(360deg)}to{transform:rotateX(68deg) rotateY(22deg) rotateZ(0)}}
@keyframes bsh{0%,100%{transform:scaleX(1);opacity:1}50%{transform:scaleX(.7);opacity:.55}}
@keyframes bgl{0%,100%{transform:scale(.9);opacity:.8}50%{transform:scale(1.08);opacity:1}}
@keyframes bname{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes bfade{to{opacity:1}}
@keyframes bbar{from{left:-40%}to{left:100%}}
@media (prefers-reduced-motion:reduce){#boot .bdrop,#boot .bring,#boot .bshadow,#boot .bglow{animation:none}#boot .bring{opacity:1}#boot .br1{transform:rotateX(74deg)}#boot .br2{transform:rotateX(68deg) rotateY(22deg)}}
</style>
<script>/* the boot screen only when opened as an app (home-screen icon), not in a browser tab or in Telegram */
(function () { try { if (matchMedia('(display-mode: standalone)').matches || navigator.standalone) {
  document.documentElement.classList.add('boot'); window.__bootAt = Date.now();
  var m = document.querySelector('meta[name=theme-color]'); if (m) m.content = '#050509'; } } catch (e) {} })();</script>
<script>/* opened from the «Панель» button of the MITAL CRM bot (?tg=1): Telegram's script first (it reads its data from the address),
   then that data is removed from the address so the CRM pages (#/...) route as usual. In a normal browser nothing is loaded. */
if (/[?&]tg=1\b/.test(location.search) || /tgWebApp/.test(location.hash)) document.write('<script src="https://telegram.org/js/telegram-web-app.js"><\/script>');</script>
<script>(function () { var T = window.Telegram && Telegram.WebApp; if (!T || !T.initData) return;
  try { T.ready(); T.expand(); if (T.disableVerticalSwipes) T.disableVerticalSwipes(); } catch (e) { /* old Telegram */ }
  document.documentElement.classList.add('in-tg');
  if (/tgWebApp/.test(location.hash)) history.replaceState(null, '', location.pathname + location.search); })();</script>

<div id="boot" aria-hidden="true"><div class="bglow"></div>
<div class="bscene"><div class="btilt"><div class="bring br1"></div><div class="bring br2"></div><div class="bdrop" id="bootDrop"></div><div class="bshadow"></div></div></div>
<div class="bname">MITAL<small>CRM</small></div><div class="bbar"><i></i></div></div>
<script>(function () { if (!document.documentElement.classList.contains('boot')) return;
  /* a 3D oil drop: the same drop drawn in thin layers one behind another, so it has real thickness while it turns */
  var D = 'M256 84c-64 94-122 162-122 232a122 122 0 0 0 244 0c0-70-58-138-122-232z', VB = '128 78 256 366', h = '', N = 14;
  for (var i = 0; i < N; i++) {
    var z = (i - (N - 1) / 2) * 1.6, face = i === 0 || i === N - 1, k = Math.abs(i - (N - 1) / 2) / ((N - 1) / 2);
    var fill = face ? 'url(#bdg' + i + ')' : 'hsl(' + (40 + k * 4) + ',100%,' + (30 + k * 12) + '%)';
    h += '<svg viewBox="' + VB + '" style="transform:translateZ(' + z + 'px)' + (i === 0 ? ' rotateY(180deg)' : '') + '">' +
      (face ? '<defs><linearGradient id="bdg' + i + '" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff3c4"/><stop offset="1" stop-color="#ffb800"/></linearGradient></defs>' : '') +
      '<path d="' + D + '" fill="' + fill + '"/>' +
      (face ? '<path d="M208 326a48 48 0 0 0 48 48" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="20" stroke-linecap="round"/>' : '') + '</svg>';
  }
  document.getElementById('bootDrop').innerHTML = h; })();</script>

<script>/* hide the boot screen once the CRM has drawn its first page (at least ~1.2 s at the first start, so the animation is seen) */
(function () { var de = document.documentElement, b = document.getElementById('boot'); if (!de.classList.contains('boot') || !b) return;
  var first = !sessionStorage.getItem('bootSeen'), done = false, app = document.getElementById('app');
  function restore() { var m = document.querySelector('meta[name=theme-color]'); if (m) m.content = de.dataset.theme === 'dark' ? '#050509' : '#eef0f6'; }
  function hide() { if (done) return; done = true; try { sessionStorage.setItem('bootSeen', '1'); } catch (e) {}
    var wait = first ? Math.max(0, 500 - (Date.now() - (window.__bootAt || 0))) : 0;
    setTimeout(function () { b.classList.add('out'); restore();
      setTimeout(function () { b.remove(); de.classList.remove('boot'); }, 320); }, wait); }
  var m0 = document.querySelector('meta[name=theme-color]'); if (m0) m0.content = '#050509';
  function ready() { return app && app.children.length > 0; }
  if (ready()) hide(); else { var mo = new MutationObserver(function () { if (ready()) { mo.disconnect(); hide(); } }); mo.observe(app, { childList: true }); }
  setTimeout(hide, 8000); })();</script>
