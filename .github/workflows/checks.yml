# On every push: every script must parse and the CRM numbers tests must pass (tests/*.test.mjs, Bot tests in Deno).
# A red mark on the commit in GitHub = something an update broke; fix before relying on that version.
name: checks
on: [push, pull_request]
jobs:
  crm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: every script parses
        run: |
          for f in *.js; do node --check "$f"; done
          cp autolinko.gs /tmp/autolinko.js && node --check /tmp/autolinko.js
      - name: numbers tests
        run: node --test tests/*.test.mjs
  bot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with: { deno-version: v2.x }
      - name: JUMAVOY tests
        working-directory: supabase/functions/ai-bot
        run: deno test -A index.test.ts
