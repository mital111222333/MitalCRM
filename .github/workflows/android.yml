# JUMAVOY for Android: builds the APK from android/ and puts it on the release «jumavoy-app»:
#   https://github.com/mital111222333/MitalCRM/releases/download/jumavoy-app/JUMAVOY.apk
# Signing: with the repository secret ANDROID_KEYSTORE_PASS (16+ characters) the permanent key is made from it on every
# build (android/tools/signing_key.py, nothing is stored) — every new APK installs over the old one. Without the secret:
# a one-off debug key (a new build needs the old app removed first).
name: android
on:
  push:
    branches: [main, 'audit/**']   # audit/* branches: build + Android Lint only, nothing is released
    paths: ['android/**', 'jumavoy/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: build
        working-directory: android
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          VCODE: ${{ github.run_number }}
        run: |
          # the page is built into the APK: JUMAVOY opens without the internet (newer copies come from GitHub later)
          mkdir -p app/src/main/assets/web && cp ../jumavoy/index.html ../jumavoy/manifest.json ../jumavoy/icon-*.png app/src/main/assets/web/
          if [ -n "$KS_PASS" ]; then
            pip install -q pycryptodome cryptography
            python3 tools/signing_key.py "$RUNNER_TEMP/jv.p12" && export KS_FILE="$RUNNER_TEMP/jv.p12"
          fi
          gradle --no-daemon assembleRelease lintRelease
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/JUMAVOY.apk"
      - name: Android Lint report
        if: always()
        working-directory: android
        run: cat app/build/reports/lint.txt 2>/dev/null || echo "no lint report"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: lint, path: android/app/build/reports/lint*, if-no-files-found: ignore }
      - name: release
        if: github.ref == 'refs/heads/main'
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release delete jumavoy-app -y --cleanup-tag -R "$GITHUB_REPOSITORY" || true
          gh release create jumavoy-app "$RUNNER_TEMP/JUMAVOY.apk" -R "$GITHUB_REPOSITORY" --latest=false \
            -t "JUMAVOY для Android (сборка ${{ github.run_number }})" \
            -n "Установите JUMAVOY.apk, откройте, вставьте ссылку из /app. Затем Настройки → Приложения по умолчанию → Цифровой помощник → JUMAVOY."
